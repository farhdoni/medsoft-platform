<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIVITA — заставка C1 «Тканая лента»</title>
<script>
/* AIVITA splash sound — fully synthesised with Web Audio, no files.
   start(): heartbeat "lub-dub" + ambient bed (field wind + distant mermaid voice with echo)
   done():  light-sweep sparkle — airy swish + glass "ting", timed to the sheen on the icon
   stop():  fades the ambient out when the splash leaves */
window.AivitaSound=(function(){
  const q=new URLSearchParams(location.search);
  let muted=q.get('sound')==='0';
  let ctx=null, bus, dry, verb, noiseBuf, amb=null;

  function impulse(sec,decay){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }
    return b;
  }
  function pink(sec){                                   // Paul Kellet pink noise, loopable
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856;
      b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
    const f=Math.floor(ctx.sampleRate*.05); for(let i=0;i<f;i++){ const k=i/f; d[i]*=k; d[n-1-i]*=k; }
    return b;
  }
  function ensure(){
    if(ctx) return ctx;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3;
    bus=ctx.createGain(); bus.gain.value=muted?0:.9; bus.connect(comp); comp.connect(ctx.destination);
    dry=ctx.createGain(); dry.connect(bus);
    const conv=ctx.createConvolver(); conv.buffer=impulse(3.6,2.4);
    verb=ctx.createGain(); verb.connect(conv); conv.connect(bus);
    noiseBuf=pink(6);
    return ctx;
  }
  function route(node,d,w){
    const a=ctx.createGain(); a.gain.value=d; node.connect(a); a.connect(dry);
    const b=ctx.createGain(); b.gain.value=w; node.connect(b); b.connect(verb);
  }
  function lfo(freq,depth,param,t){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=freq; g.gain.value=depth;
    o.connect(g); g.connect(param); o.start(t); return o;
  }
  const running=()=>!!ensure()&&ctx.state==='running';

  /* heartbeat */
  function thump(t,level){
    [[1,'sine',1],[2.02,'triangle',.45]].forEach(([m,type,l])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(95*m,t); o.frequency.exponentialRampToValueAtTime(42*m,t+.14);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(level*l,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
      o.connect(g); g.connect(dry); o.start(t); o.stop(t+.22);
    });
  }

  /* ambient: wind over a dandelion field */
  function wind(t,out,stops){
    const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=650; bp.Q.value=.9;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
    const g=ctx.createGain(); g.gain.value=.34;
    const pan=ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
    src.connect(hp); hp.connect(bp); bp.connect(lp); lp.connect(g); g.connect(pan); pan.connect(out);
    stops.push(src, lfo(.07,320,bp.frequency,t), lfo(.19,120,bp.frequency,t),     // whistle drifting
                    lfo(.11,.14,g.gain,t), lfo(.29,.06,g.gain,t));                // gusts
    if(pan.pan) stops.push(lfo(.045,.7,pan.pan,t));                               // moves across the field
    src.start(t);
  }

  /* ambient: a far-away mermaid — formant voice gliding in A-minor pentatonic, with echo */
  const VOWEL={u:[360,820],o:[480,900],a:[720,1150]};
  function mermaid(t,out,stops){
    const phrase=[[440,'u',0],[659.25,'o',1.3],[587.33,'a',2.7],[523.25,'o',3.9]];
    const len=5.6, peak=.42;
    const env=ctx.createGain(); env.gain.setValueAtTime(0,t);
    env.gain.linearRampToValueAtTime(peak,t+1.6); env.gain.setValueAtTime(peak,t+3.6); env.gain.linearRampToValueAtTime(0,t+len);
    const f1=ctx.createBiquadFilter(), f2=ctx.createBiquadFilter();
    f1.type=f2.type='bandpass'; f1.Q.value=6; f2.Q.value=9;
    const mix=ctx.createGain(); mix.gain.value=1;
    const g2=ctx.createGain(); g2.gain.value=.55;
    f1.connect(mix); f2.connect(g2); g2.connect(mix); mix.connect(env);
    const voices=[[1,'sawtooth',.5],[1.004,'triangle',.9],[2,'sine',.12]];
    const oscs=voices.map(([m,type,l])=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; g.gain.value=l;
      o.connect(g); g.connect(f1); g.connect(f2); o.start(t); o.stop(t+len+.1); return [o,m];
    });
    phrase.forEach(([f,v,at])=>{
      oscs.forEach(([o,m])=>o.frequency.setTargetAtTime(f*m,t+at,at?0.18:0.001));
      f1.frequency.setTargetAtTime(VOWEL[v][0],t+at,.35); f2.frequency.setTargetAtTime(VOWEL[v][1],t+at,.35);
    });
    oscs.forEach(([o,m])=>{ const v=lfo(5.1,4.2*m,o.frequency,t+.5); v.stop(t+len+.1); });   // vibrato
    // echo: two taps drifting left / right, darkened, then into the reverb
    [[.43,-.7],[.86,.7]].forEach(([d,p],i)=>{
      const dl=ctx.createDelay(2); dl.delayTime.value=d;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000-i*600;
      const g=ctx.createGain(); g.gain.value=.5-i*.18;
      const pn=ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain(); if(pn.pan) pn.pan.value=p;
      env.connect(dl); dl.connect(lp); lp.connect(g); g.connect(pn); pn.connect(out.wet);
    });
    env.connect(out.soft);
  }

  function startAmbient(){
    if(amb) return;
    const t=ctx.currentTime+.05, stops=[];
    const master=ctx.createGain(); master.gain.setValueAtTime(0,t); master.gain.linearRampToValueAtTime(1,t+1.4);
    route(master,.75,.45);
    const soft=ctx.createGain(); soft.gain.value=.55; soft.connect(master);        // voice mostly "far"
    const wetBus=ctx.createGain(); wetBus.gain.setValueAtTime(0,t); wetBus.gain.linearRampToValueAtTime(1,t+1.4); wetBus.connect(verb);
    soft.connect(wetBus);
    wind(t,master,stops);
    const sing=()=>{ if(amb) mermaid(ctx.currentTime+.05,{soft,wet:wetBus},stops); };
    const first=setTimeout(sing,500), loop=setInterval(sing,9000);
    amb={master,wetBus,soft,stops,first,loop};
  }
  function stopAmbient(fade){
    if(!amb) return; const a=amb; amb=null;
    clearTimeout(a.first); clearInterval(a.loop);
    const t=ctx.currentTime;
    [a.master,a.wetBus].forEach(g=>{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+fade); });
    a.stops.forEach(n=>{ try{ n.stop(t+fade+.1); }catch(e){} });
  }

  /* light-sweep glint — «golden dust»: a trail of tiny pentatonic sparkles following the sheen */
  function pan(p){ const n=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain(); if(n.pan) n.pan.value=p; return n; }
  function tone(at,f,{type='sine',level=.1,att=.003,dec=.5,p=0,d=.7,w=.5}={}){
    const o=ctx.createOscillator(), e=ctx.createGain(), pn=pan(p);
    o.type=type; o.frequency.value=f;
    e.gain.setValueAtTime(.0001,at); e.gain.exponentialRampToValueAtTime(level,at+att); e.gain.exponentialRampToValueAtTime(.0001,at+att+dec);
    o.connect(e); e.connect(pn); route(pn,d,w); o.start(at); o.stop(at+att+dec+.05); return o;
  }
  function air(t,level,dur){                       // faint breath that travels with the sheen
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.8;
    bp.frequency.setValueAtTime(2500,t); bp.frequency.exponentialRampToValueAtTime(7000,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(level,t+dur*.45); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    const pn=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();
    if(pn.pan){ pn.pan.setValueAtTime(-.6,t); pn.pan.linearRampToValueAtTime(.6,t+dur); }
    s.connect(bp); bp.connect(g); g.connect(pn); route(pn,.6,.6); s.start(t,Math.random()*4); s.stop(t+dur+.05);
  }
  const PENTA=[1760,2093.0,2349.3,2637.0,3136.0,3520.0];
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };   // repeatable "randomness"
  function sparkle(t){
    seed=7;
    const d0=dry, w0=verb, gd=ctx.createGain(), gw=ctx.createGain();
    gd.gain.value=gw.gain.value=2.5;       // lift the glint ~6 dB above the ambient bed
    gd.connect(d0); gw.connect(w0); dry=gd; verb=gw;
    try{
      air(t,.08,.9);
      for(let i=0;i<18;i++){ const k=i/17, at=t+.05+Math.pow(k,.8)*.8;
        tone(at,PENTA[Math.floor(rnd()*PENTA.length)]*(rnd()<.2?.5:1),{level:.05+.05*Math.sin(Math.PI*k),dec:.25+rnd()*.35,p:-.7+1.4*k,d:.5,w:.8}); }
    } finally { dry=d0; verb=w0; }
  }

  return {
    unlock(){ if(!ensure()) return Promise.resolve();
      return Promise.race([ctx.resume().catch(()=>{}), new Promise(r=>setTimeout(r,250))]); },
    get ready(){ return running(); },
    get muted(){ return muted; },
    set muted(v){ muted=!!v; if(ctx){ const t=ctx.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setTargetAtTime(muted?0:.9,t,.08); } },
    start(){ if(!running()) return; const t=ctx.currentTime+.05; thump(t+.12,.55); thump(t+.45,.32); startAmbient(); },
    done(){ if(!running()) return; sparkle(ctx.currentTime+.1); },
    stop(fade=1.2){ if(ctx) stopAmbient(fade); }
  };
})();
</script>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;})();</script>

<style>
:root{--bg:#0E1A2B;--bg-2:#13233A;--text:#EAF6F8;--muted:#8FA6B8;--greet:#9DF1F8;--cyan:#46DCEB;
  --shadow:0 20px 60px -20px rgba(70,220,235,.35);--track:rgba(255,255,255,.08);
  --r:#C9493E;--g:#E2B24B;--t:#3AA396;--b:#4C74B5}
:root[data-theme="light"]{--bg:#F4F3EF;--bg-2:#FBFAF7;--text:#2B2630;--muted:#857C84;--greet:#9C5E6C;
  --shadow:0 24px 50px -22px rgba(14,26,43,.45);--track:rgba(43,38,48,.08)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#aivita-splash{--p:0;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(90% 60% at 50% 42%,var(--bg-2),var(--bg) 70%);transition:opacity .5s .15s,visibility .6s}
#aivita-splash.is-gone{opacity:0;visibility:hidden}
.icon{width:min(44vw,176px);aspect-ratio:1;position:relative}
.icon > img,.icon > svg{width:100%;height:100%;display:block}
.icon > img{border-radius:22%;box-shadow:var(--shadow)}
.is-gone .icon{transform:scale(6);opacity:0;transition:transform .6s cubic-bezier(.6,0,.8,.3),opacity .5s .1s}
/* light sweep across the tile on arrival */
.sheen{position:absolute;inset:0;border-radius:22%;overflow:hidden;pointer-events:none}
.sheen::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.is-done .sheen::before{animation:sweep .9s cubic-bezier(.4,0,.2,1) .1s}
@keyframes sweep{to{left:130%}}
.word{margin-top:28px;font-family:Unbounded,system-ui,sans-serif;font-weight:600;font-size:clamp(24px,7vw,32px);letter-spacing:.08em;display:flex}
.word span{opacity:0;transform:translateY(8px);animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.status{margin-top:14px;min-height:1.5em;font-size:15px;color:var(--muted);text-align:center;padding:0 24px;transition:opacity .3s}
.status.greet{color:var(--greet);font-weight:500}

.icon{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.icon::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:46%;translate:-50% -52%;border-radius:50%;
  background:radial-gradient(circle,rgba(157,241,248,.55),transparent 70%);animation:beat 1.2s ease-in-out infinite;mix-blend-mode:screen}
@keyframes beat{0%,100%{opacity:.2;transform:scale(.9)}14%{opacity:.9;transform:scale(1.15)}28%{opacity:.35}42%{opacity:.8;transform:scale(1.08)}}
.band{margin-top:22px;width:min(60vw,240px);height:8px;position:relative;border-radius:2px;background:var(--track);overflow:hidden}
.band i{position:absolute;inset:0;clip-path:inset(0 calc((1 - var(--p))*100%) 0 0);background:repeating-linear-gradient(90deg,var(--r) 0 26px,var(--g) 26px 30px,var(--r) 30px 33px,var(--g) 33px 58px,var(--t) 58px 62px,var(--g) 62px 65px,var(--t) 65px 90px,var(--b) 90px 94px,var(--t) 94px 97px,var(--b) 97px 122px,var(--r) 122px 126px,var(--b) 126px 129px);animation:drift 3s linear infinite}
@keyframes drift{to{background-position:129px 0}}
.band b{position:absolute;top:-2px;bottom:-2px;width:3px;left:calc(var(--p)*100% - 3px);background:#fff;box-shadow:0 0 10px var(--cyan);border-radius:2px}
.is-done .band b{opacity:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}.word span{opacity:1;transform:none}}
/* waiting for a tap (preview only: browsers block sound until the first gesture) */
.wait .icon,.wait .icon::after,.wait .word span,.wait .band i{animation-play-state:paused}
.wait .icon{opacity:0}
.tap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;z-index:2}
.wait .tap{display:flex}
.tap span{margin-top:62vh;padding:10px 18px;border-radius:999px;font:500 14px Manrope,system-ui,sans-serif;color:var(--text);
  background:var(--track);box-shadow:inset 0 0 0 1px var(--track)}
.tap:focus-visible span{outline:2px solid var(--cyan);outline-offset:3px}
.mute{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:36px;height:36px;border-radius:50%;border:0;
  background:var(--track);color:var(--muted);font-size:16px;cursor:pointer;z-index:3}
.mute:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

</div>

<script>(function(){
  const q = new URLSearchParams(location.search);
  const LANG = (q.get('lang') || 'ru').slice(0,2);
  const COPY = {
    ru:'Загрузка вашего здоровья!',
    uz:'Salomatligingiz yuklanmoqda!',
    en:'Loading your health!'
  };
  const T = COPY[LANG] || COPY.ru;
  const root = document.getElementById('aivita-splash');
  const st = document.getElementById('status');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shown = 0, target = 0, done = false, landed = false, idx = 0;
  function say(t, greet){ st.style.opacity = 0; setTimeout(()=>{ st.textContent=t; st.classList.toggle('greet',!!greet); st.style.opacity=1; }, reduce?0:200); }
  say(T);
    function frame(){
    shown += (target - shown) * (reduce ? 1 : 0.12);
    if (Math.abs(target-shown) < 0.002) shown = target;
    root.style.setProperty('--p', shown.toFixed(4));
    root.setAttribute('aria-valuenow', Math.round(shown*100));
    if (window.onSplashProgress) window.onSplashProgress(shown);
    if (done && shown >= 1) return land();
    requestAnimationFrame(frame);
  }
  function land(){
    if (landed) return; landed = true; 
    root.classList.add('is-done');
    window.AivitaSound && AivitaSound.done();
    setTimeout(hide, reduce ? 600 : 1000);
  }
  function hide(){
    if (root.dataset.keep === 'true') return;
    root.classList.add('is-gone');
    window.AivitaSound && AivitaSound.stop();
    setTimeout(()=>window.dispatchEvent(new CustomEvent('aivita:splash-done')), 600);
  }
  window.AivitaSplash = { setProgress(p){ target = Math.max(target, Math.min(1,+p||0)); }, finish(){ target=1; done=true; }, hide };
  requestAnimationFrame(frame);
  function startDemo(){
    if (q.get('loop') === '1') root.dataset.keep = 'true';
    let p = 0; const t = setInterval(()=>{ p += Math.random()*0.09+0.02; if(p>=1){clearInterval(t); AivitaSplash.finish();} else AivitaSplash.setProgress(p); },180);
  }
  const S = window.AivitaSound, tap = document.getElementById('tap'), mute = document.getElementById('mute');
  const paintMute = ()=>{ mute.textContent = S.muted ? '🔇' : '🔊'; mute.setAttribute('aria-pressed', String(!S.muted)); };
  paintMute();
  mute.addEventListener('click', ()=>{ S.muted = !S.muted; paintMute(); S.unlock(); });
  function go(){ S.start(); if (q.get('demo') !== '0') startDemo(); }
  // try to start with sound right away (works in the app shell / after prior interaction)
  S.unlock().catch(()=>{}).finally(()=>{
    if (S.ready || S.muted || q.get('autostart') === '1') return go();
    root.classList.add('wait');                       // browser blocked audio: wait for one tap
    tap.addEventListener('click', ()=>{ S.unlock().finally(()=>{ root.classList.remove('wait'); go(); }); }, {once:true});
    tap.focus();
  });
})();
</script></body></html>
