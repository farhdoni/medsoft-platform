name: Deploy Landing (aivita.uz)

# Syncs apps/landing to the VPS's plain nginx-served directory
# (/var/www/aivita-landing — NOT a Coolify application, NOT behind
# Coolify's native webhook). See apps/landing/DEPLOY.md for the full
# rationale and the exclude list explained.
#
# REQUIRED REPO SECRETS:
#   LANDING_SSH_KEY  — PEM/OpenSSH private key for a key scoped ONLY to
#                      this job. authorized_keys on the VPS pins it to:
#                        command="/usr/bin/rrsync -wo -no-del /var/www/aivita-landing/"
#                      plus no-pty/no-port-forwarding/no-X11-forwarding/
#                      no-agent-forwarding/no-user-rc. It cannot run any
#                      command other than a write-only rsync confined to
#                      that one directory (verified: arbitrary commands
#                      and syncs to any other path are both rejected —
#                      rrsync treats every destination path as relative
#                      to its confined root, so there is no path that can
#                      escape it). This is deliberately NOT the same key
#                      deploy-coolify.yml uses (COOLIFY_SSH_KEY) — that
#                      one is itself restricted to tunnel-only use
#                      (command="exit ...") and cannot run rsync at all.
#   VPS_HOST         — e.g. 109.123.249.224 (reused from deploy-coolify.yml)
#
# No-op (exit 0 notice) when either required secret is absent.
#
# Because the SSH key is confined via a forced rrsync command, the rsync
# destination below is deliberately just "root@$VPS_HOST:" with NO path
# — rrsync silently treats any path the client sends as relative to its
# own confined root, so repeating /var/www/aivita-landing/ here would
# resolve to a nonexistent nested subdirectory and fail.
#
# Safety properties:
#   - rsync runs WITHOUT --delete: files that exist on the server but not
#     in the repo (see apps/landing/DEPLOY.md) are never removed. The key
#     itself also enforces this server-side (-no-del), independent of
#     what flags this workflow ever sends.
#   - downloads/aivita-patient.apk is excluded outright — the server's
#     copy is newer than git's (see apps/landing/DEPLOY.md, point 6).
#   - workflow_dispatch defaults to a dry run (rsync --dry-run); a push
#     to main always does a real sync.

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (rsync --dry-run — nothing is actually copied)"
        type: boolean
        default: true

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync apps/landing to the VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Stage landing content with cache-busted asset URLs
        id: stage
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=8 HEAD)"
          STAGE="$(mktemp -d)"
          cp -a apps/landing/. "$STAGE/"
          python3 .github/scripts/cache_bust_assets.py "$STAGE" "$SHA"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Sync to VPS
        env:
          LANDING_SSH_KEY: ${{ secrets.LANDING_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          STAGE_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail

          # ── Guard ────────────────────────────────────────────────────────────
          if [ -z "${LANDING_SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "::notice::Required secrets not set (LANDING_SSH_KEY / VPS_HOST) — no-op."
            exit 0
          fi

          # push -> always a real sync. workflow_dispatch -> dry-run unless
          # explicitly set to false.
          DRY_FLAG=""
          if [ "$EVENT_NAME" != "push" ] && [ "${DRY_RUN_INPUT}" != "false" ]; then
            DRY_FLAG="--dry-run"
            echo "::notice::DRY RUN — rsync will report changes but copy nothing."
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${LANDING_SSH_KEY}" > ~/.ssh/landing_key
          chmod 600 ~/.ssh/landing_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -i ~/.ssh/landing_key"

          # ── Exclusions ───────────────────────────────────────────────────────
          # Everything below either (a) lives on the server only and is never
          # in git — listed here for documentation and as a defensive backstop
          # against a future accidental commit of the same name — or (b) IS in
          # git but must not reach the server. Full rationale in
          # apps/landing/DEPLOY.md. No --delete is used anywhere, so anything
          # NOT listed here that only exists on the server is left alone
          # regardless (the key's -no-del restriction enforces this too).
          #
          # Destination is deliberately "root@$VPS_HOST:" with no path — see
          # the header comment above for why repeating the directory here
          # would break under the confined key.
          rsync -avz --itemize-changes $DRY_FLAG \
            -e "ssh $SSH_OPTS" \
            --exclude='*.bak*' \
            --exclude='downloads/aivita-patient.apk' \
            --exclude='6e3a3321e0a7ac487e75f14c6909ebf9.txt' \
            --exclude='api/' \
            --exclude='package.json' \
            --exclude='vercel.json' \
            --exclude='nginx.conf' \
            --exclude='.env.example' \
            --exclude='.gitignore' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            "${STAGE_DIR}/" "root@${VPS_HOST}:"

          if [ -n "$DRY_FLAG" ]; then
            echo ""
            echo "::notice::Dry run complete — nothing was copied. Re-run with dry_run=false (or push to main) to apply."
          else
            echo ""
            echo "Sync complete."
          fi
